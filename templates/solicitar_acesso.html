<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solicitar Acesso | Administração MEC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #12141d; 
            --card-bg: #1e212b; 
            --primary-green: #00a859; 
            --primary-hover: #008f4c; 
            --text-main: #f8f9fa; 
            --text-muted: #8b92a5; 
            --border-color: #2d313f; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        html, body {
            max-width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; /* Garante margem no mobile */
            background-image: radial-gradient(circle at top right, rgba(0, 168, 89, 0.08), transparent 50%),
                              radial-gradient(circle at bottom left, rgba(0, 168, 89, 0.03), transparent 40%);
            -webkit-font-smoothing: antialiased;
        }

        .login-wrapper { 
            background-color: var(--card-bg); 
            width: 100%; 
            max-width: 460px; 
            border-radius: 12px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.02) inset; 
            position: relative; 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
            animation: formFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes formFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-wrapper::before { 
            content: ''; 
            position: absolute; 
            top: 0; left: 0; right: 0; 
            height: 4px; 
            background: linear-gradient(90deg, #00a859, #00d27a); 
        }

        .login-content { 
            padding: clamp(30px, 6vw, 45px); 
        }

        .brand-header { text-align: center; margin-bottom: 35px; }
        .brand-header i { font-size: 32px; color: var(--primary-green); margin-bottom: 12px; }
        .brand-header h2 { font-size: clamp(20px, 5vw, 24px); font-weight: 900; margin-bottom: 6px; letter-spacing: -0.5px; }
        .brand-header p { font-size: 14px; color: var(--text-muted); font-weight: 400; }

        .alert-box { 
            background-color: rgba(0, 168, 89, 0.1); 
            color: #2bd868; 
            border-left: 4px solid #28a745; 
            padding: 14px 16px; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 25px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            animation: fadeIn 0.4s ease;
        }
        
        .alert-error { 
            background-color: rgba(255, 107, 107, 0.1); 
            color: #ff6b6b; 
            border-left-color: #ff6b6b; 
        }

        .input-group { position: relative; margin-bottom: 18px; }
        .input-group i.left-icon { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            left: 18px; 
            color: #5c6275; 
            font-size: 15px; 
            transition: color 0.3s ease;
        }
        
        .input-group input { 
            width: 100%; 
            background-color: rgba(0, 0, 0, 0.25); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 15px 15px 15px 45px; 
            border-radius: 8px; 
            font-size: 14.5px; 
            font-weight: 500;
            outline: none; 
            transition: all 0.25s ease; 
        }

        /* Espaço extra para o ícone de revelar senha */
        .input-group input.has-right-icon { padding-right: 45px; }

        .input-group input:focus { 
            border-color: var(--primary-green); 
            box-shadow: 0 0 0 4px rgba(0, 168, 89, 0.15); 
            background-color: rgba(0, 0, 0, 0.4);
        }

        .input-group input:focus + i.left-icon, 
        .input-group input:not(:placeholder-shown) + i.left-icon {
            color: var(--primary-green);
        }

        /* Botão de revelar senha */
        .toggle-password {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 18px;
            color: #5c6275;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
            background: none;
            border: none;
            outline: none;
        }
        .toggle-password:hover { color: var(--text-main); }

        .btn-submit { 
            width: 100%; 
            background-color: var(--primary-green); 
            color: #fff; 
            border: none; 
            padding: 16px; 
            border-radius: 8px; 
            font-size: 15.5px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .btn-submit:hover:not(:disabled) { 
            background-color: var(--primary-hover); 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 168, 89, 0.25);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer-links { 
            margin-top: 30px; 
            padding-top: 25px; 
            border-top: 1px solid var(--border-color); 
            text-align: center; 
        }
        
        .footer-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            transition: color 0.2s; 
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .footer-links a:hover { color: var(--text-main); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-content">
            
            <div class="brand-header">
                <i class="fas fa-shield-check"></i>
                <h2>Solicitação de Acesso</h2>
                <p>Crie suas credenciais para aprovação interna</p>
            </div>

            {% if sucesso %}
            <div class="alert-box">
                <i class="fas fa-check-circle"></i> 
                <span>{{ sucesso }}</span>
            </div>
            {% endif %}
            
            {% if erro %}
            <div class="alert-box alert-error">
                <i class="fas fa-exclamation-circle"></i> 
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            <!-- Interceptador onsubmit para evitar multi-cliques e dar feedback visual -->
            <form method="POST" action="/solicitar_acesso" id="registroForm" onsubmit="processarEnvio(event)">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="input-group">
                    <input type="text" name="nome" placeholder="Seu Nome Completo" required minlength="5" maxlength="80" autocomplete="name">
                    <i class="fas fa-id-card left-icon"></i>
                </div>
                
                <div class="input-group">
                    <input type="text" name="cargo" placeholder="Cargo/Função no Órgão" required minlength="3" maxlength="60" autocomplete="organization-title">
                    <i class="fas fa-briefcase left-icon"></i>
                </div>
                
                <div class="input-group">
                    <input type="text" name="usuario" placeholder="Crie um Usuário (Ex: nome.sobrenome)" required minlength="4" maxlength="30" autocomplete="username">
                    <i class="fas fa-user left-icon"></i>
                </div>
                
                <div class="input-group">
                    <!-- autocomplete="new-password" é vital para a segurança em telas de registro -->
                    <input type="password" id="senhaInput" name="senha" class="has-right-icon" placeholder="Crie uma Senha Forte" required minlength="8" autocomplete="new-password">
                    <i class="fas fa-lock left-icon"></i>
                    <button type="button" class="toggle-password" onclick="toggleSenha()" title="Mostrar/Ocultar Senha" tabindex="-1">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    Enviar Solicitação <i class="fas fa-paper-plane"></i>
                </button>
            </form>

            <div class="footer-links">
                <a href="/login"><i class="fas fa-arrow-left"></i> Voltar para o Login Seguro</a>
            </div>
            
        </div>
    </div>

    <script>
        // UX: Função para mostrar/ocultar a senha digitada
        function toggleSenha() {
            const senhaInput = document.getElementById('senhaInput');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                senhaInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Segurança e UX: Trava o formulário após o primeiro clique (previne double-submit)
        function processarEnvio(event) {
            const btn = document.getElementById('btnSubmit');
            
            // Verifica se o formulário é válido (HTML5 validation)
            if (document.getElementById('registroForm').checkValidity()) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Criptografando Dados...';
                // O formulário seguirá seu fluxo normal para o backend (POST)
            }
        }
    </script>

</body>
</html>
