{% extends "base.html" %}

{% block content %}
<!-- SEGURANÇA: Bloqueio de seleção de texto para evitar extração (cópia) não autorizada dos dados sensíveis listados na tabela -->
<style>
    body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }
    /* Permite seleção APENAS na barra de pesquisa e nos modais/prompts do navegador */
    input, textarea, select { 
        user-select: auto !important; 
        -webkit-user-select: auto !important; 
    }
</style>

<h1 style="color: #0056b3; text-align: left;">Excluir Aluno</h1>

<!-- Formulário de Pesquisa com Trava -->
<form method="POST" action="/excluir" style="display: flex; gap: 10px; margin-bottom: 30px;" onsubmit="return blindarBusca(this)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="termo" placeholder="Digite o Nome ou CPF exato..." style="flex: 1;" required>
    <button type="submit" style="padding: 10px 20px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: opacity 0.2s;">Pesquisar</button>
</form>

{% if alunos %}
    <table style="width: 100%; border-collapse: collapse; background-color: #2a2a35; border-radius: 8px; overflow: hidden; margin-bottom: 30px;">
        <tr style="background-color: #0056b3; color: white; text-align: left;">
            <th style="padding: 15px;">Nome</th>
            <th style="padding: 15px;">CPF</th>
            <th style="padding: 15px;">Curso</th>
            <th style="padding: 15px;">Ação</th>
        </tr>
        {% for aluno in alunos %}
        <tr style="border-bottom: 1px solid #3a3a45;">
            <td style="padding: 15px; color: #ccc;">{{ aluno['nome'] }}</td>
            <td style="padding: 15px; color: #ccc;">{{ aluno['cpf'] }}</td>
            <td style="padding: 15px; color: #ccc;">{{ aluno['curso'] }}</td>
            <td style="padding: 15px;">
                <!-- Formulário de Exclusão Individual com Trava -->
                <form method="POST" action="/deletar/{{ aluno['id'] }}" style="display: inline; margin: 0;" onsubmit="return blindarExclusaoUnica(this, '{{ aluno['nome'] }}');">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" style="background-color: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: inherit; transition: opacity 0.2s;">Excluir</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endif %}

<!-- Botão Master de Exclusão com Trava -->
<div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #3a3a45; text-align: right;">
    <form method="POST" action="/deletar_todos" style="display: inline; margin: 0;" onsubmit="return confirmarApagarTodos(this);">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="senha_confirmacao" id="senha_confirmacao_todos">
        <button type="submit" style="background-color: #8b0000; color: white; padding: 12px 20px; border-radius: 5px; font-weight: bold; border: 1px solid #ff4c4c; cursor: pointer; font-family: inherit; transition: opacity 0.2s;">⚠️ Apagar Todos os Cadastros</button>
    </form>
</div>

<script>
    // ==========================================
    // SEGURANÇA: Travas de Duplo Envio (Double Submit Locks)
    // ==========================================
    
    function blindarBusca(form) {
        var btn = form.querySelector('button[type="submit"]');
        if (btn.disabled) return false;
        
        btn.disabled = true;
        btn.innerHTML = 'Pesquisando...';
        btn.style.opacity = '0.7';
        btn.style.cursor = 'not-allowed';
        return true;
    }

    function blindarExclusaoUnica(form, nomeAluno) {
        if (!confirm('Tem certeza que deseja excluir permanentemente o cadastro de ' + nomeAluno + '?')) {
            return false;
        }
        
        var btn = form.querySelector('button[type="submit"]');
        if (btn.disabled) return false;
        
        btn.disabled = true;
        btn.innerHTML = 'Excluindo...';
        btn.style.opacity = '0.7';
        btn.style.cursor = 'not-allowed';
        return true;
    }

    function confirmarApagarTodos(form) {
        if (!confirm('ATENÇÃO: Isso vai apagar TODOS os alunos cadastrados no banco de dados. Esta ação não pode ser desfeita. Tem certeza absoluta?')) {
            return false;
        }
        
        var senha = prompt('Para confirmar, digite a senha de administrador:');
        if (senha === null || senha === '') {
            return false;
        }
        
        form.querySelector('#senha_confirmacao_todos').value = senha;
        
        // Bloqueio do botão Master para evitar corrupção por multi-cliques
        var btn = form.querySelector('button[type="submit"]');
        if (btn.disabled) return false;
        
        btn.disabled = true;
        btn.innerHTML = '⚠️ Apagando Banco...';
        btn.style.opacity = '0.7';
        btn.style.cursor = 'not-allowed';
        return true;
    }

    // ==========================================
    // SEGURANÇA: Anti-Inspect / Anti-Tampering
    // ==========================================
    
    // Desabilita o botão direito (Inspecionar/Salvar)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault(); 
    });

    // Desabilita atalhos de teclado de desenvolvedor (F12, Ctrl+Shift+I, etc)
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || 
           (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) || 
           (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
            e.preventDefault();
        }
    });
</script>
{% endblock %}
