<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema em Manutenção</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #d35400;
            margin-bottom: 15px;
        }
        p {
            line-height: 1.6;
            color: #666;
            font-size: 1.1em;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Sistema em Manutenção</h1>
        <p>Nosso sistema de consultas está passando por uma atualização para melhorar a sua experiência.</p>
        <p>Voltaremos a operar normalmente em breve. Agradecemos a compreensão!</p>
    </div>
</body>
</html>
