<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    
    <!-- SEGURANÇA GLOBAL: Prevenção de Cache Estrito para evitar vazamento de dados em computadores públicos (LGPD) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Permitir que o Google rastreie e indexe o sistema -->
    <meta name="robots" content="index, follow">
    
    <!-- Definir a página canônica dinamicamente para evitar conflitos de domínios duplicados -->
    <link rel="canonical" href="{{ request.base_url }}">
    
    <title>SECRETARIA DE REGISTROS CNE|MEC</title>
    
    <!-- Fonte Premium (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Cores da área de conteúdo (Dark Mode) */
            --bg-main: #0b0f19;
            --border-color: #232b3e;
            --text-main: #e2e8f0;
            
            /* Cores da Sidebar (Azul Chamativo e Executivo) */
            --sidebar-bg-top: #0056b3;
            --sidebar-bg-bottom: #003670;
            --sidebar-accent: #00d2ff;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; 
            min-height: 100vh; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            overflow-x: hidden; 
            width: 100%;
            
            /* SEGURANÇA GLOBAL: Dificulta seleção de texto para evitar adulteração visual e cópias */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Permite seleção apenas nos inputs/selects para não quebrar a digitação da equipe */
        input, textarea, select, .select2-container, .select2-search__field { 
            user-select: auto !important; 
            -webkit-user-select: auto !important; 
        }

        /* Scrollbar Premium e Minimalista */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a5568; }

        /* ========================================== */
        /* SIDEBAR AZUL SÊNIOR COM TEXTO BRANCO       */
        /* ========================================== */
        .sidebar { 
            width: 270px;
            background: linear-gradient(180deg, var(--sidebar-bg-top) 0%, var(--sidebar-bg-bottom) 100%);
            display: flex; 
            flex-direction: column; 
            position: fixed; 
            top: 0;
            left: 0;
            height: 100vh; 
            box-shadow: 4px 0 25px rgba(0,0,0,0.5);
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.1);
        }

        .sidebar-header h2 { 
            margin: 0; 
            font-size: 16px; 
            color: #ffffff; 
            text-transform: uppercase; 
            letter-spacing: 1.2px;
            font-weight: 800;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            gap: 6px; 
            flex: 1;
            overflow-y: auto;
        }

        .sidebar a { 
            padding: 14px 22px; 
            text-decoration: none; 
            color: rgba(255, 255, 255, 0.9); 
            font-size: 15px; 
            font-weight: 600; 
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 4px solid transparent;
            transition: all 0.25s ease; 
        }

        .sidebar a:hover { 
            background-color: rgba(0, 0, 0, 0.2); 
            color: #ffffff; 
            border-left: 4px solid var(--sidebar-accent);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .sidebar a span {
            font-size: 18px;
            min-width: 20px;
            text-align: center;
        }

        .logout-link {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 10px;
        }

        .sidebar a.logout-link:hover {
            background-color: rgba(220, 53, 69, 0.2);
            border-left: 4px solid #ff4757;
            color: #ff4757;
            text-shadow: none;
        }

        /* ========================================== */
        /* ÁREA DE CONTEÚDO PRINCIPAL                 */
        /* ========================================== */
        .content { 
            margin-left: 270px; 
            padding: 40px; 
            width: calc(100% - 270px); 
            min-height: 100vh;
            background-color: var(--bg-main);
        }

        .content h1 { 
            font-size: 28px; 
            margin-bottom: 20px; 
            font-weight: 700;
        }

        /* ========================================== */
        /* RESPONSIVIDADE TABLETS E IPADS (MAX 1024px) */
        /* ========================================== */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
            .content {
                margin-left: 240px;
                width: calc(100% - 240px);
                padding: 30px;
            }
        }

        /* ========================================== */
        /* RESPONSIVIDADE MOBILE (MAX 768px)          */
        /* ========================================== */
        @media (max-width: 768px) {
            body { 
                flex-direction: column; 
            }
            
            .sidebar { 
                width: 100%; 
                position: relative; 
                height: auto; 
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            }
            
            .sidebar-header { 
                padding: 15px 20px; 
            }

            .sidebar-header h2 {
                font-size: 14px;
                letter-spacing: 1px;
            }
            
            .nav-links { 
                flex-direction: row; 
                padding: 0; 
                overflow-x: auto; 
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
                gap: 0;
            }
            
            .sidebar a { 
                padding: 14px 16px; 
                font-size: 14px;
                border-left: none;
                border-bottom: 4px solid transparent;
                flex-shrink: 0;
            }
            
            .sidebar a:hover { 
                border-left: none;
                border-bottom: 4px solid var(--sidebar-accent);
            }

            .logout-link {
                margin-top: 0;
                border-top: none;
                margin-bottom: 0;
                border-left: 1px solid rgba(255,255,255,0.15);
            }
            
            .sidebar a.logout-link:hover {
                border-left: 1px solid rgba(255,255,255,0.15);
                border-bottom: 4px solid #ff4757;
            }
            
            .content { 
                margin-left: 0; 
                width: 100%; 
                padding: 20px 15px; 
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>SECRETARIA DE REGISTROS<br>CNE | MEC</h2>
        </div>
        <div class="nav-links">
            <a href="/"><span>🏠</span> Início</a>
            <a href="/cadastro"><span>📝</span> Cadastro</a>
            <a href="/alterar"><span>🔄</span> Alterar</a>
            <a href="/excluir"><span>🗑️</span> Excluir</a>
            <a href="/informacoes/graduacao"><span>🎓</span> Graduações</a>
            
            <a href="/logout" class="logout-link"><span>🚪</span> Sair</a>
        </div>
    </div>
    
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- ========================================== -->
    <!-- SEGURANÇA GLOBAL: Anti-Inspect / Tampering -->
    <!-- ========================================== -->
    <script>
        // Desabilita o botão direito em todo o sistema
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault(); 
        });

        // Desabilita atalhos de desenvolvedor (F12, Ctrl+Shift+I, Ctrl+U, etc)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
               (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) || 
               (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
