<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Profissional - Confea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .main-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 4px solid #0b3c5d;
        }
        .header-confea {
            text-align: center;
            padding: 25px 20px 15px 20px;
            border-bottom: 1px solid #eaeaea;
        }
        .header-confea img {
            width: 70px;
            height: auto;
            margin-bottom: 10px;
        }
        .header-confea h3 {
            font-size: 11px;
            color: #666;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-confea h2 {
            font-size: 14px;
            color: #0b3c5d;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            line-height: 1.4;
        }
        .form-section {
            padding: 25px 25px 35px 25px;
        }
        .form-section h4 {
            font-size: 15px;
            color: #0b3c5d;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #444;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            color: #333;
        }
        .form-control[readonly] {
            background-color: #fafafa;
            color: #555;
        }
        .recaptcha-box {
            border: 1px solid #d3d3d3;
            background: #f9f9f9;
            border-radius: 4px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }
        .recaptcha-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .recaptcha-left input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #0b3c5d;
            cursor: pointer;
        }
        .recaptcha-right {
            text-align: center;
        }
        .recaptcha-right img {
            width: 32px;
            height: auto;
        }
        .recaptcha-right span {
            display: block;
            font-size: 9px;
            color: #555;
            margin-top: 2px;
        }
        .recaptcha-footer {
            font-size: 9px;
            color: #777;
            margin-top: 4px;
        }
        .recaptcha-footer a {
            color: #555;
            text-decoration: underline;
        }
        .btn-submit {
            width: 100%;
            background-color: #1d4ed8;
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #1e40af;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- CABEÇALHO OFICIAL CONFEA -->
        <div class="header-confea">
            <!-- Brasão da República Oficial -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fb.Bras%C3%A3o_de_armas_do_Brasil.svg" alt="Brasão do Brasil">
            <h3>Serviço Público Federal</h3>
            <h2>Conselho Federal de Engenharia e Agronomia - Confea</h2>
        </div>

        <!-- FORMULÁRIO DE CONSULTA -->
        <div class="form-section">
            <h4>Consultar Profissional do Sistema Confea/Crea</h4>

            <form action="#" method="GET">
                <div class="form-group">
                    <label>Nome do profissional:</label>
                    <input type="text" class="form-control" value="{{ aluno.nome }}" readonly>
                </div>

                <div class="form-group">
                    <label>CPF:</label>
                    <input type="text" class="form-control" value="{{ aluno.cpf }}" readonly>
                </div>

                <div class="form-group">
                    <label>Nº Registro Nacional (RNP):</label>
                    <input type="text" class="form-control" value="{{ aluno.numero_registro or aluno.matricula }}" readonly>
                </div>

                <!-- BLOCO RECAPTCHA FIEL À IMAGEM -->
                <div class="recaptcha-box">
                    <div>
                        <div class="recaptcha-left">
                            <input type="checkbox" id="robot" checked onclick="return false;">
                            <label for="robot" style="margin:0; cursor:pointer; font-weight:normal;">Não sou um robô</label>
                        </div>
                        <div class="recaptcha-footer">
                            reCAPTCHA · <a href="#">Privacidade</a> · <a href="#">Termos</a>
                        </div>
                    </div>
                    <div class="recaptcha-right">
                        <!-- Ícone oficial reCAPTCHA -->
                        <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="reCAPTCHA">
                        <span>reCAPTCHA</span>
                    </div>
                </div>

                <button type="button" class="btn-submit" onclick="alert('Registro validado e verificado com sucesso pelo Sistema Confea/Crea.');">Localizar Profissional</button>
            </form>
        </div>
    </div>

</body>
</html>
